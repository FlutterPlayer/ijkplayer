# 构建需要 JDK 17+（AGP 8.x）：export JAVA_HOME=/opt/homebrew/opt/openjdk@17
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

# Published artifact identity (kept unchanged for downstream consumers)
VERSION_NAME=1.0.4
VERSION_CODE=010000
GROUP=io.github.flutterplayer
POM_ARTIFACT_ID=fplayercore
POM_NAME=fplayercore

RELEASE_REPOSITORY_URL=https://s01.oss.sonatype.org/service/local/staging/deploy/maven2/
SNAPSHOT_REPOSITORY_URL=https://s01.oss.sonatype.org/content/repositories/snapshots/

# Native (CMake/NDK)
IJK_CXX_STL=c++_static
